set -sg escape-time 0
set -g base-index 1
set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g pane-active-border-style fg=#969696
set -g pane-border-style fg=#363636

# set -g status-position top

unbind C-b
set -g prefix M-a
bind M-a send-prefix

set -g status-style 'bg=#969696 fg=#000000'
# set -g status-right "#(acpi -b | awk -F', ' '{gsub(/%/, \"\", $2); print $2 \"%\"}') | %y-%m-%d %H:%M "
set -g status-right "%y-%m-%d %H:%M "

bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'


bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r -n C-h resize-pane -L 3
bind -r -n C-j resize-pane -D 3
bind -r -n C-k resize-pane -U 3
bind -r -n C-l resize-pane -R 3

bind -n M-0 selectw -t 0
bind -n M-1 selectw -t 1
bind -n M-2 selectw -t 2
bind -n M-3 selectw -t 3
bind -n M-4 selectw -t 4
bind -n M-5 selectw -t 5
bind -n M-6 selectw -t 6
bind -n M-7 selectw -t 7
bind -n M-8 selectw -t 8
bind -n M-9 selectw -t 9
bind -n M-tab selectw -n

bind -n M-x kill-pane

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-window

bind b run-shell "tmux set -g status \"#{?#{==:#{status},on},off,on}\""
