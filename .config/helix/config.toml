theme = "ashen"

[editor]
bufferline = "multiple"
line-number = "relative"
continue-comments = false

auto-format = false
auto-completion = false
gutters = ["diagnostics", "line-numbers", "spacer", "spacer"]

default-yank-register = "+"
clipboard-provider = "pasteboard"

rulers = [80]
[editor.soft-wrap] 
wrap-at-text-width = true
wrap-indicator = ""

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["file-name", "spacer",
        "version-control",
        "read-only-indicator",
        "file-modification-indicator"]

[editor.lsp]
auto-signature-help = false
[editor.inline-diagnostics]
max-diagnostics = 5
cursor-line = "warning"

# ---------Bindings---------
[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
"tab" = "goto_word"
"}" = ["goto_next_paragraph"]
"{" = ["goto_prev_paragraph"]
ret = ":w"

[keys.normal.space]
"F" = "file_picker_in_current_buffer_directory"
"m" = "@:cd <C-r>%<C-w><ret>"
"=" = ":toggle auto-completion"
ret = ":toggle insert-final-newline"
"l" = ":reflow"

[keys.select]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
"}" = ["goto_next_paragraph"]
"{" = ["goto_prev_paragraph"]
ret = ":w"

[keys.select.space]
"F" = "file_picker_in_current_buffer_directory"
"m" = "@:cd <C-r>%<C-w><ret>"
"=" = ":toggle auto-completion"
ret = ":toggle insert-final-newline"
"l" = ":reflow"
