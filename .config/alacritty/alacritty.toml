[window]
padding.x = 8
padding.y = 8
decorations = "none"
startup_mode = "fullscreen"
option_as_alt = "Both"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[font]
size = 14

[font.normal]
family = "CommitMono"
style = "Regular"

[font.bold]
family = "CommitMono"
style = "Bold"

[font.italic]
family = "CommitMono"
style = "Italic"

[scrolling]
history = 10000

[general]
import = ["~/.config/alacritty/ashen.toml"]
